name: Build AutoSpeaker APK

on:
  push:
    branches: [ main, feat/vivo-x60-auto-speaker ]
    paths: [ 'autospeaker/**', '.github/workflows/autospeaker.yml' ]
  pull_request:
    paths: [ 'autospeaker/**', '.github/workflows/autospeaker.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: autospeaker
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSpeaker-debug
          path: autospeaker/app/build/outputs/apk/debug/app-debug.apk
